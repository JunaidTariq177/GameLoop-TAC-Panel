name: Build GameLoop TAC Panel (Windows EXE)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows x64 app
        run: dotnet publish GameLoopTACPanel/GameLoopTACPanel.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Package EXE
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath GameLoopTACPanel-Windows-x64.zip -Force

      - name: Upload downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: GameLoopTACPanel-Windows-x64
          path: GameLoopTACPanel-Windows-x64.zip
          if-no-files-found: error
